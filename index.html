<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hugo Casillas González</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:       #c8a96e;
    --accent-dark:  #a8894e;
    --accent-tint:  rgba(200, 169, 110, 0.08);
    --white:      #ffffff;
    --divider:    #f0f0f0;
    --text-main:  #1a1a1a;
    --text-sub:   #6b6b6b;
    --text-muted: #b0b0b0;
    --radius:     16px;
  }

  html, body {
    min-height: 100vh;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    padding: 2rem 1rem;
  }

  .card {
    width: 100%;
    max-width: 390px;
    background: var(--white);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 4px 6px rgba(200, 169, 110, 0.08),
      0 12px 40px rgba(0, 0, 0, 0.10),
      0 2px 4px rgba(0, 0, 0, 0.04);
    animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Language toggle ── */
  .lang-toggle {
    position: absolute;
    top: 1rem;
    right: 1rem;
    display: flex;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.30);
    border-radius: 20px;
    padding: 3px;
    z-index: 10;
    gap: 2px;
    backdrop-filter: blur(4px);
  }

  .lang-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    padding: 4px 11px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: transparent;
    color: rgba(255, 255, 255, 0.70);
  }

  .lang-btn.active {
    background: var(--white);
    color: var(--accent);
  }

  /* ── Header ── */
  .header {
    background: var(--accent);
    padding: 2.25rem 1.75rem 1.75rem;
    position: relative;
  }

  .initials {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.2rem;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
  }

  .initials span {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 25px;
    font-weight: 500;
    color: var(--white);
    letter-spacing: -0.2px;
    line-height: 1.2;
    margin-bottom: 5px;
  }

  .role {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.80);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .industry {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.85);
  }

  /* ── Location chip ── */
  .location-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 12px;
    padding: 4px 10px 4px 8px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
  }

  .location-chip svg {
    width: 11px;
    height: 11px;
    stroke: rgba(255, 255, 255, 0.80);
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .location-chip span {
    font-size: 11px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
  }

  /* ── Contact rows ── */
  .contacts {
    padding: 0.25rem 0;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 1.75rem;
    border-bottom: 1px solid var(--divider);
    text-decoration: none;
    transition: background 0.15s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .contact-row:last-child {
    border-bottom: none;
  }

  .contact-row:active {
    background: var(--accent-tint);
  }

  .icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--accent-tint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon svg {
    width: 15px;
    height: 15px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .contact-info { flex: 1; min-width: 0; }

  .contact-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .contact-value {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    flex-shrink: 0;
  }

  .arrow svg {
    width: 14px;
    height: 14px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── Save button ── */
  .footer {
    padding: 1.25rem 1.75rem 1.6rem;
    border-top: 1px solid var(--divider);
  }

  .save-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .save-btn:hover  { background: var(--accent-dark); }
  .save-btn:active { transform: scale(0.98); background: var(--accent-dark); }

  .save-btn svg {
    width: 16px;
    height: 16px;
    stroke: var(--white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tagline {
    text-align: center;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 0.9rem;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>

<div class="card">

  <!-- Language toggle -->
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="initials"><span>HCG</span></div>
    <p class="name">Hugo Casillas González</p>
    <p class="role">CEO</p>
    <p class="industry" id="txt-industry">Fresh Produce &amp; Food Export</p>
    <div class="location-chip">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <span>Jalisco, México</span>
    </div>
  </div>

  <!-- Contact rows -->
  <div class="contacts">

    <a class="contact-row" href="tel:+523781270425">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 11.5a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .84h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      </div>
      <div class="contact-info">
        <p class="contact-label" id="lbl-phone">Phone</p>
        <p class="contact-value">+52 378 127 0425</p>
      </div>
      <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>

    <a class="contact-row" href="https://wa.me/523781270425">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </div>
      <div class="contact-info">
        <p class="contact-label">WhatsApp</p>
        <p class="contact-value">+52 378 127 0425</p>
      </div>
      <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>

    <a class="contact-row" href="mailto:jito.charro@hotmail.com">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <div class="contact-info">
        <p class="contact-label">Email</p>
        <p class="contact-value">jito.charro@hotmail.com</p>
      </div>
      <div class="arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>

  </div>

  <!-- Save contact -->
  <div class="footer">
    <button class="save-btn" onclick="saveContact()">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="btn-save">Save Contact</span>
    </button>
    <p class="tagline" id="txt-tagline">Fresh Produce · Export · México</p>
  </div>

</div>

<script>
const strings = {
  en: {
    industry: 'Fresh Produce &amp; Food Export',
    phone:    'Phone',
    save:     'Save Contact',
    tagline:  'Fresh Produce · Export · México'
  },
  es: {
    industry: 'Exportación de Alimentos y Verduras Frescas',
    phone:    'Teléfono',
    save:     'Guardar Contacto',
    tagline:  'Verduras Frescas · Exportación · México'
  }
};

function setLang(lang) {
  const s = strings[lang];
  document.getElementById('txt-industry').innerHTML = s.industry;
  document.getElementById('lbl-phone').textContent  = s.phone;
  document.getElementById('btn-save').textContent   = s.save;
  document.getElementById('txt-tagline').textContent = s.tagline;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-es').classList.toggle('active', lang === 'es');
  document.documentElement.lang = lang;
}

function saveContact() {
  const vcard =
`BEGIN:VCARD
VERSION:3.0
FN:Hugo Casillas González
N:Casillas González;Hugo;;;
TITLE:CEO
ORG:Casillas
TEL;TYPE=CELL:+523781270425
EMAIL:hugo@casillas.com
ADR;TYPE=WORK:;;Jalisco;México
NOTE:Fresh Produce & Food Export
END:VCARD`;

  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'hugo-casillas.vcf';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
